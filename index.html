<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cloud Quest · Nimbus IT · BTEC Unit 1 C1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f7;
        --surface: #ffffff;
        --surface2: #f6f8fb;
        --ink: #1b2340;
        --ink2: #4b5563;
        --muted: #6b7280;
        --line: #d6dde8;
        --teal: #12939a;
        --amber: #f2a93b;
        --orange: #e08a3b;
        --green: #2fa76f;
        --red: #d9534f;
        --navy: #1b2340;
        --tealSoft: #e3f4f4;
        --amberSoft: #fff2dc;
        --greenSoft: #e3f5ec;
        --redSoft: #fbe7e6;
        --head: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
        --body: 'Atkinson Hyperlegible', Calibri, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1426;
          --surface: #1a2140;
          --surface2: #141a33;
          --ink: #e8ecf6;
          --ink2: #b8c1d6;
          --muted: #8a94ad;
          --line: #2c3559;
          --tealSoft: #123a40;
          --amberSoft: #3a2e17;
          --greenSoft: #163a2b;
          --redSoft: #3f1e22;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1426;
        --surface: #1a2140;
        --surface2: #141a33;
        --ink: #e8ecf6;
        --ink2: #b8c1d6;
        --muted: #8a94ad;
        --line: #2c3559;
        --tealSoft: #123a40;
        --amberSoft: #3a2e17;
        --greenSoft: #163a2b;
        --redSoft: #3f1e22;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 17px;
        line-height: 1.55;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--navy);
      }
      h1,
      h2,
      h3 {
        font-family: var(--head);
        line-height: 1.15;
        margin: 0 0 0.4em;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      img {
        max-width: 100%;
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--navy);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
      }
      .brand {
        font-family: var(--head);
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand small {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 11px;
        color: #9fb0d4;
      }
      .top .sp {
        flex: 1;
      }
      .chip {
        font-family: var(--mono);
        font-size: 13px;
        background: rgba(255, 255, 255, 0.1);
        padding: 5px 10px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .chip b {
        color: var(--amber);
      }
      .tbtn {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
      .tbtn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
      }
      .btn {
        background: var(--teal);
        color: #fff;
        border: 0;
        padding: 11px 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 16px;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--teal);
        border: 2px solid var(--teal);
      }
      .btn.amber {
        background: var(--amber);
        color: #1b2340;
      }
      input[type='text'],
      textarea,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--surface2);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        width: 100%;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--teal);
      }
      /* start */
      .hero {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 28px;
        align-items: center;
        padding: 30px 0 10px;
      }
      .hero h1 {
        font-size: clamp(42px, 6vw, 76px);
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .hero p {
        font-size: 19px;
        color: var(--ink2);
        max-width: 60ch;
      }
      .hero .card {
        box-shadow: 0 10px 30px rgba(27, 35, 64, 0.08);
      }
      .lab {
        font-weight: 700;
        display: block;
        margin: 0 0 6px;
      }
      .tickets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 22px;
      }
      .ticket {
        position: relative;
        text-align: left;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 18px 18px 16px;
        color: var(--ink);
        min-height: 190px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ticket .code {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .ticket h3 {
        font-size: 22px;
        margin: 2px 0 0;
      }
      .ticket .topic {
        color: var(--teal);
        font-weight: 700;
      }
      .ticket .client {
        color: var(--ink2);
        font-size: 15px;
      }
      .ticket .st {
        margin-top: auto;
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        align-self: flex-start;
      }
      .ticket.open {
        border-color: var(--teal);
      }
      .ticket.open:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(18, 147, 154, 0.15);
      }
      .ticket.done {
        border-color: var(--green);
      }
      .ticket.locked {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .ticket.boss {
        background: var(--navy);
        color: #fff;
        border-color: var(--amber);
      }
      .ticket.boss .client {
        color: #c7d2e3;
      }
      .ticket.boss .topic {
        color: var(--amber);
      }
      .st.s-open {
        background: var(--tealSoft);
        color: var(--teal);
      }
      .st.s-done {
        background: var(--greenSoft);
        color: var(--green);
      }
      .st.s-locked {
        background: var(--surface2);
        color: var(--muted);
      }
      .progress {
        height: 10px;
        background: var(--surface2);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--green));
      }
      .rowflex {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      /* zone */
      .zonehead {
        display: flex;
        gap: 16px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .zonehead h2 {
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .zonehead .meta {
        color: var(--ink2);
      }
      .zgrid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      .brief {
        max-height: calc(100vh - 150px);
        overflow: auto;
        position: sticky;
        top: 74px;
      }
      .brief h3 {
        font-size: 21px;
        margin-top: 1.1em;
        color: var(--ink);
      }
      .brief table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 12px;
        font-size: 15px;
      }
      .brief th,
      .brief td {
        border: 1px solid var(--line);
        padding: 7px 9px;
        text-align: left;
        vertical-align: top;
      }
      .brief th {
        background: var(--surface2);
      }
      .brief figure {
        margin: 12px 0;
        background: #fff;
        border-radius: 12px;
        padding: 8px;
        border: 1px solid var(--line);
      }
      .brief figcaption {
        color: #4b5563;
        font-size: 14px;
        font-style: italic;
        padding: 6px 6px 2px;
      }
      .brief ul {
        padding-left: 22px;
      }
      .brief li {
        margin: 3px 0;
      }
      .tag {
        display: inline-block;
        font-family: var(--mono);
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 20px;
        background: var(--amberSoft);
        color: #8a5a0b;
      }
      :root[data-theme='dark'] .tag {
        color: var(--amber);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .tag {
          color: var(--amber);
        }
      }
      .task {
        margin-bottom: 16px;
      }
      .task.locked {
        opacity: 0.5;
      }
      .task .qn {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .task .q {
        font-weight: 700;
        font-size: 18px;
        margin: 6px 0 12px;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--surface2);
        border: 2px solid var(--line);
        color: var(--ink);
        padding: 11px 14px;
        border-radius: 10px;
        margin: 8px 0;
      }
      .opt:hover {
        border-color: var(--teal);
      }
      .opt.sel {
        border-color: var(--teal);
        background: var(--tealSoft);
      }
      .mrow {
        display: grid;
        grid-template-columns: 1fr minmax(150px, 200px);
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
      }
      .tfbtn {
        min-width: 92px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid var(--line);
        background: var(--surface2);
        color: var(--ink);
        font-weight: 700;
      }
      .tfbtn.t {
        border-color: var(--green);
        color: var(--green);
      }
      .tfbtn.f {
        border-color: var(--red);
        color: var(--red);
      }
      .fb {
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 16px;
      }
      .fb.ok {
        background: var(--greenSoft);
      }
      .fb.no {
        background: var(--redSoft);
      }
      .fb.hint {
        background: var(--amberSoft);
      }
      .done-badge {
        color: var(--green);
        font-weight: 700;
      }
      .tutor {
        background: none;
        border: 0;
        color: var(--muted);
        text-decoration: underline;
        font-size: 14px;
        padding: 0;
        margin-left: auto;
      }
      .pre-block {
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin: 10px 0;
        background: var(--surface2);
      }
      .pre-block h4 {
        margin: 0 0 8px;
        font-family: var(--head);
        font-size: 18px;
        color: var(--orange);
      }
      .pill {
        display: inline-block;
        font-weight: 700;
        font-size: 13px;
        padding: 2px 10px;
        border-radius: 20px;
        color: #fff;
        margin: 8px 0 4px;
      }
      .p-p {
        background: var(--teal);
      }
      .p-r {
        background: var(--orange);
      }
      .p-e {
        background: #2e3a63;
      }
      .compiled {
        white-space: pre-wrap;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        font-size: 15px;
        max-height: 320px;
        overflow: auto;
      }
      .wc {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        text-align: right;
      }
      /* guide */
      .gtabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 18px;
      }
      .gtabs button {
        background: var(--surface);
        border: 2px solid var(--line);
        color: var(--ink);
        padding: 8px 14px;
        border-radius: 10px;
        font-weight: 700;
      }
      .gtabs button.on {
        border-color: var(--teal);
        background: var(--tealSoft);
      }
      .gloss {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .gloss div {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .gloss div:nth-child(odd) {
        font-weight: 700;
        background: var(--surface2);
      }
      /* cert */
      .cert {
        text-align: center;
        padding: 40px 24px;
        border: 3px solid var(--amber);
        background: var(--surface);
        border-radius: 22px;
        max-width: 760px;
        margin: 20px auto;
      }
      .cert h1 {
        font-size: clamp(34px, 5vw, 56px);
        font-weight: 800;
      }
      .cert .name {
        font-family: var(--head);
        font-size: clamp(28px, 4vw, 44px);
        color: var(--teal);
        font-weight: 700;
      }
      .badges {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 16px 0;
      }
      .badge {
        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 20px;
        background: var(--greenSoft);
        color: var(--green);
        border: 1px solid var(--green);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--navy);
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 700;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        z-index: 20;
        display: none;
      }
      .toast b {
        color: var(--amber);
      }
      @media (max-width: 860px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .tickets {
          grid-template-columns: 1fr 1fr;
        }
        .zgrid {
          grid-template-columns: 1fr;
        }
        .brief {
          position: static;
          max-height: none;
        }
        .mrow {
          grid-template-columns: 1fr;
        }
        .gloss {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        .tickets {
          grid-template-columns: 1fr;
        }
        .top .chip.hide-sm {
          display: none;
        }
        main {
          padding: 16px 12px 50px;
        }
      }
      @media print {
        .top,
        .gtabs,
        .noprint {
          display: none !important;
        }
        body {
          background: #fff;
        }
        .brief {
          max-height: none;
          position: static;
        }
      }
    </style>
  </head>
  <body>

      <div class="sp"></div>
      <span class="chip hide-sm" id="hName"></span>
      <span class="chip"

      <button class="tbtn" id="btnMap">Job board</button>
      <button class="tbtn" id="btnGuide">Field guide</button>
    </header>
    <main id="app"></main>

    <script>
      (function () {
        const CQ = (function () {
          const k = 'nimbus-cq-s9';
          const bin = atob(window.CQX);
          const u = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++)
            u[i] = bin.charCodeAt(i) ^ k.charCodeAt(i % k.length);
          return JSON.parse(new TextDecoder().decode(u));
        })();
        const IMGS = CQ.imgs;
        const Z = CQ.zones,
          KEY = 'cloudquest_s9_v1';
        function hsh(s) {
          let h = 5381;
          for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0;
          return h;
        }
        const TUTOR_H = 668842604;
        function lev(a, b) {
          const m = a.length,
            n = b.length;
          if (!m) return n;
          if (!n) return m;
          let p = Array.from({ length: n + 1 }, (_, j) => j);
          for (let i = 1; i <= m; i++) {
            const c = [i];
            for (let j = 1; j <= n; j++)
              c[j] = Math.min(
                p[j] + 1,
                c[j - 1] + 1,
                p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
              );
            p = c;
          }
          return p[n];
        }
        function fuzzyHas(input, target) {
          const it = norm(input).split(' ').filter(Boolean),
            tt = norm(target).split(' ').filter(Boolean);
          const k = tt.length,
            tj = tt.join(' ');
          const tol = tj.length >= 8 ? 2 : tj.length >= 5 ? 1 : 0;
          for (let i = 0; i + k <= it.length; i++) {
            const w = it.slice(i, i + k).join(' ');
            if (w === tj || (tol && lev(w, tj) <= tol)) return true;
            if (k === 1 && w.length > tj.length && w.startsWith(tj))
              return true;
          }
          if (k === 1) {
            const joined = it.join('');
            if (joined === tj || (tol && lev(joined, tj) <= tol)) return true;
          }
          return false;
        }
        const $ = (s) => document.querySelector(s);
        const esc = (s) =>
          String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
        const escU = (s) =>
          String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        function sqText(t) {
          return t
            .replace(/(^|[\s(\[—–\-\/])"/g, '$1“')
            .replace(/"/g, '”')
            .replace(/(^|[\s(\[—–\-\/])'/g, '$1‘')

        }

        const blank = () => ({

            const r = localStorage.getItem(KEY);

          const t = $('#toast');

            .toLowerCase()
            .replace(/[^a-z0-9 ]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

      <span class="code">${z.code} · ${z.tasks.length} tasks</span><h3>${esc(z.title)}</h3><span class="topic">${esc(z.topic)}</span>
      <span class="client">${esc(z.client)}</span><span class="st s-${st}">${lbl}</span></button>`;

          $('#app').innerHTML = sq(h);

        /* ZONE */

        }
        const IMGALT = {
          D1: 'Diagram: phone, laptop, tablet and PC connect through a phone mast or home router to the internet and on to a provider data centre of linked servers.',

          D4: 'Diagram: remote desktop. Keyboard and mouse input travels from the home laptop to the office PC; screen images travel back. The data stays in the office.',

        function taskShell(zi, ti, inner, extra) {
          const z = Z[zi],
            t = z.tasks[ti],

            locked = ti > st.idx;

    <div class="q">${esc(t.q)}</div>${locked ? '<p style="color:var(--muted)">Finish the task above to unlock this one.</p>' : inner}
    ${!locked && !done ? `<div class="rowflex" style="margin-top:12px"><button class="btn chk">${(extra && extra.btn) || 'Check answer'}</button>${!z.boss ? '<button class="tutor">Tutor unlock</button>' : ''}</div><div class="fbx"></div>` : ''}`;
        }

        function renderTask(zi, ti) {
          const z = Z[zi],
            t = z.tasks[ti],
            st = zs(z.id),
            el = document.getElementById('t' + ti),
            done = ti < st.idx || st.done;
          let inner = '',
            sel = null;
          const k = 'a' + ti;
          st.att[k] = st.att[k] || 0;
          if (t.type === 'mc') {
            inner = t.options
              .map(
                (o, i) =>
                  `<button class="opt ${done && i === t.answer ? 'sel' : ''}" data-i="${i}">${esc(o)}</button>`,
              )
              .join('');
          }
          if (t.type === 'multi') {
            inner =
              `<p style="margin:-6px 0 6px;color:var(--muted);font-size:14px">Select all that apply.</p>` +
              t.options
                .map(
                  (o, i) =>
                    `<button class="opt ${done && t.answers.includes(i) ? 'sel' : ''}" data-i="${i}">${esc(o)}</button>`,
                )
                .join('');
          }
          if (t.type === 'text') {
            inner = `<input type="text" class="ans" autocomplete="off" ${done ? 'disabled value="✓"' : ''}>`;
          }
          if (t.type === 'keywords') {
            inner = `<textarea class="ans" style="min-height:70px" ${done ? 'disabled' : ''}>${done ? 'Security, cost, ease of use, features, connectivity' : ''}</textarea>`;
          }
          if (t.type === 'match' || t.type === 'order') {
            const items =
              t.type === 'order'
                ? t.steps.map((s, i) => ({ t: s, a: i }))
                : t.items;
            const order =
              t.type === 'order'
                ? shuffleFixed(
                    items.map((_, i) => i),
                    zi * 7 + ti,
                  )
                : items.map((_, i) => i);
            const choices =
              t.type === 'order'
                ? items.map((_, i) => 'Step ' + (i + 1))
                : t.choices;
            inner = order
              .map(
                (ii) =>
                  `<div class="mrow"><span>${esc(items[ii].t)}</span><select data-ii="${ii}" ${done ? 'disabled' : ''}><option value="">Choose…</option>${choices.map((c, ci) => `<option value="${ci}" ${done && ci === items[ii].a ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>`,
              )
              .join('');
          }
          if (t.type === 'tf') {
            inner = t.items
              .map(
                (it, i) =>
                  `<div class="mrow"><span>${esc(it.t)}</span><button class="tfbtn ${done ? (it.a ? 't' : 'f') : ''}" data-i="${i}" ${done ? 'disabled' : ''}>${done ? (it.a ? 'True' : 'False') : 'Choose'}</button></div>`,
              )
              .join('');
          }
          if (t.type === 'write') {
            const v = S.notes[z.id + '_' + ti] || t.starter || '';
            inner = `<textarea class="ans" ${done ? 'disabled' : ''}>${escU(v)}</textarea><div class="wc"><span class="cnt">${words(v)}</span> words · at least ${t.min}</div><p style="font-size:14px;color:var(--muted);margin:6px 0 0">This is saved to your field guide. Copy it to your C1 Google Site page later.</p>`;
          }
          if (t.type === 'factor3') {
            inner = t.options
              .map(
                (o) =>
                  `<button class="opt ${S.boss.factors.includes(o) ? 'sel' : ''}" data-f="${o}" ${done ? 'disabled' : ''}>${o}</button>`,
              )
              .join('');
          }
          if (t.type === 'pre') {
            inner =
              S.boss.factors
                .map((f) => {
                  const v = S.boss.pre[f] || {};
                  return `<div class="pre-block"><h4>${f}</h4>${['p', 'r', 'e'].map((x) => `<span class="pill p-${x}">${{ p: 'Point', r: 'Reason', e: 'Effect: so what for Seren?' }[x]}</span><textarea data-f="${f}" data-x="${x}" style="min-height:64px" ${done ? 'disabled' : ''}>${escU(v[x] || '')}</textarea>`).join('')}</div>`;
                })
                .join('') +
              `<p style="font-size:14px;color:var(--muted)">Tip: compare the VPN and remote desktop inside each factor. Each box needs at least 4 words.</p>`;
          }
          if (t.type === 'conclusion') {
            const c = S.boss.concl;
            inner = [
              ['o', 'Overall,', 'Seren should use…'],
              ['b', 'because', 'the most important factor is… (use the brief)'],
              [
                'h',
                'However,',
                'what could go wrong, or who it wouldn’t suit, and what Seren could do about it',
              ],
            ]
              .map(
                (r) =>
                  `<span class="pill p-${r[0] === 'o' ? 'p' : r[0] === 'b' ? 'r' : 'e'}">${r[1]}</span><textarea data-x="${r[0]}" placeholder="${r[2]}" style="min-height:64px" ${done ? 'disabled' : ''}>${escU(c[r[0]] || '')}</textarea>`,
              )
              .join('');
          }
          if (t.type === 'checklist') {
            inner =
              `<div class="compiled" id="comp">${escU(bossText())}</div>
      <div class="rowflex noprint" style="margin:10px 0"><button class="btn ghost" id="cpy">Copy my answer</button></div>` +
              t.items
                .map(
                  (it, i) =>
                    `<label class="mrow" style="grid-template-columns:28px 1fr;cursor:pointer"><input type="checkbox" data-i="${i}" ${S.boss.checks[i] || done ? 'checked' : ''} ${done ? 'disabled' : ''}><span>${esc(it)}</span></label>`,
                )
                .join('');
          }
          el.innerHTML = sq(
            taskShell(
              zi,
              ti,
              inner,
              t.type === 'checklist'
                ? { btn: 'Close the ticket' }
                : t.type === 'write'
                  ? { btn: 'Save field note' }
                  : t.type === 'factor3' ||
                      t.type === 'pre' ||
                      t.type === 'conclusion'
                    ? { btn: 'Save and continue' }
                    : null,
            ),
          );
          if (ti > st.idx || done) {
            if (t.type === 'checklist' && done) {
              const c = el.querySelector('#cpy');
              if (c) c.onclick = () => copyText(bossText());
            }
            return;
          }
          // interactions
          if (t.type === 'mc') {
            el.querySelectorAll('.opt').forEach(
              (b) =>
                (b.onclick = () => {
                  el.querySelectorAll('.opt').forEach((x) =>
                    x.classList.remove('sel'),
                  );
                  b.classList.add('sel');
                }),
            );
          }
          if (t.type === 'multi' || t.type === 'factor3') {
            el.querySelectorAll('.opt').forEach(
              (b) => (b.onclick = () => b.classList.toggle('sel')),
            );

          if (t.type === 'tf') {
            el.querySelectorAll('.tfbtn').forEach(
              (b) =>
                (b.onclick = () => {
                  const s = b.dataset.v === 't' ? 'f' : 't';
                  b.dataset.v = s;
                  b.className = 'tfbtn ' + s;
                  b.textContent = s === 't' ? 'True' : 'False';
                }),
            );
          }
          if (t.type === 'write') {
            const ta = el.querySelector('textarea');
            ta.oninput = () => {
              el.querySelector('.cnt').textContent = words(ta.value);

              save();
            };
          }
          if (t.type === 'pre') {
            el.querySelectorAll('textarea').forEach(
              (ta) =>
                (ta.oninput = () => {
                  const f = ta.dataset.f;
                  S.boss.pre[f] = S.boss.pre[f] || {};
                  S.boss.pre[f][ta.dataset.x] = ta.value;
                  save();
                }),
            );
          }
          if (t.type === 'conclusion') {
            el.querySelectorAll('textarea').forEach(
              (ta) =>
                (ta.oninput = () => {
                  S.boss.concl[ta.dataset.x] = ta.value;
                  save();
                }),
            );
          }
          if (t.type === 'checklist') {
            el.querySelector('#cpy').onclick = () => copyText(bossText());
            el.querySelectorAll('input[type=checkbox]').forEach(
              (c) =>
                (c.onchange = () => {
                  S.boss.checks[+c.dataset.i] = c.checked;
                  save();
                }),
            );
          }
          const tb = el.querySelector('.tutor');
          if (tb)
            tb.onclick = () => {
              const code = prompt('Tutor code:');
              if (code && hsh(code.trim().toUpperCase()) === TUTOR_H) {
                complete(zi, ti, true);
              } else if (code !== null) {
                fb(el, 'no', 'That code isn’t right. Ask your tutor.');
              }
            };
          el.querySelector('.chk').onclick = () => check(zi, ti, el);
        }
        function fb(el, cls, html) {
          el.querySelector('.fbx').innerHTML =
            `<div class="fb ${cls}">${sq(html)}</div>`;
        }
        function shuffleFixed(arr, seed) {
          const a = arr.slice();
          let s = seed + 11;
          for (let i = a.length - 1; i > 0; i--) {
            s = (s * 9301 + 49297) % 233280;
            const j = Math.floor((s / 233280) * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          if (a.every((v, i) => v === i)) a.push(a.shift());
          return a;
        }

        function check(zi, ti, el) {
          const z = Z[zi],
            t = z.tasks[ti],
            st = zs(z.id),
            k = 'a' + ti;
          let ok = false,
            msg = '';
          if (t.type === 'mc') {
            const s = el.querySelector('.opt.sel');
            if (!s) return fb(el, 'hint', 'Pick an answer first.');
            ok = +s.dataset.i === t.answer;
          }
          if (t.type === 'multi') {
            const s = [...el.querySelectorAll('.opt.sel')]
              .map((b) => +b.dataset.i)
              .sort();
            if (!s.length) return fb(el, 'hint', 'Pick at least one.');
            ok = JSON.stringify(s) === JSON.stringify(t.answers.slice().sort());
          }
          if (t.type === 'text') {
            const v = norm(el.querySelector('.ans').value);
            if (!v) return fb(el, 'hint', 'Type an answer first.');
            ok = t.accept.some((a) => fuzzyHas(v, a));
          }
          if (t.type === 'keywords') {
            const v = norm(el.querySelector('.ans').value);
            const miss = t.groups.filter(
              (g) => !g.some((w) => fuzzyHas(v, w) || v.includes(w)),
            ).length;
            ok = miss === 0;
            if (!ok) msg = `You have ${5 - miss} of the 5. `;
          }
          if (t.type === 'match' || t.type === 'order') {
            const sels = [...el.querySelectorAll('select')];
            if (sels.some((s) => s.value === ''))
              return fb(el, 'hint', 'Choose an option for every row.');
            const items =
              t.type === 'order' ? t.steps.map((s, i) => ({ a: i })) : t.items;
            const right = sels.filter(
              (s) => +s.value === items[+s.dataset.ii].a,
            ).length;
            ok = right === sels.length;
            if (!ok) msg = `${right} of ${sels.length} correct. `;
          }
          if (t.type === 'tf') {
            const bs = [...el.querySelectorAll('.tfbtn')];
            if (bs.some((b) => !b.dataset.v))
              return fb(el, 'hint', 'Set every statement to True or False.');
            const right = bs.filter(
              (b) => (b.dataset.v === 't') === t.items[+b.dataset.i].a,
            ).length;
            ok = right === bs.length;
            if (!ok) msg = `${right} of ${bs.length} correct. `;
          }
          if (t.type === 'write') {
            const v = el.querySelector('textarea').value;
            if (words(v) < t.min)
              return fb(
                el,
                'hint',
                `A bit more, please: at least ${t.min} words. Have you got a point, a reason and a “so…”?`,
              );
            if (
              /"so/.test(t.q) &&
              !/\bso\b|which means|this means|meaning/i.test(v)
            )
              return fb(
                el,
                'hint',
                'Where is your “so what?”. Add “so…” and say what it means for the client.',
              );
            S.notes[z.id + '_' + ti] = v;
            return complete(zi, ti, false, true);
          }
          if (t.type === 'factor3') {
            const s = [...el.querySelectorAll('.opt.sel')].map(
              (b) => b.dataset.f,
            );
            if (s.length !== 3)
              return fb(
                el,
                'hint',
                `Choose exactly three factors (you have ${s.length}).`,
              );
            S.boss.factors = s;
            S.boss.factors.forEach(
              (f) => (S.boss.pre[f] = S.boss.pre[f] || {}),
            );
            return complete(zi, ti, false, true);
          }
          if (t.type === 'pre') {
            const short = S.boss.factors.filter((f) =>
              ['p', 'r', 'e'].some((x) => words((S.boss.pre[f] || {})[x]) < 4),
            );
            if (short.length)
              return fb(
                el,
                'hint',
                `Add more to ${short.join(', ')}: every box needs at least 4 words.`,
              );
            const noSeren = S.boss.factors.filter(
              (f) =>
                !/seren|consultant|candidate|rural|cv|database/i.test(
                  Object.values(S.boss.pre[f]).join(' '),
                ),
            );
            if (noSeren.length)
              return fb(
                el,
                'hint',
                `${noSeren.join(', ')}: use the scenario. Mention Seren, its consultants, the CVs, the database or the rural staff.`,
              );
            return complete(zi, ti, false, true);
          }
          if (t.type === 'conclusion') {
            const c = S.boss.concl;
            if (['o', 'b', 'h'].some((x) => words(c[x]) < 5))
              return fb(
                el,
                'hint',
                'Each part of the conclusion needs at least 5 words.',
              );
            if (!/vpn|remote desktop|both/i.test(c.o))
              return fb(
                el,
                'hint',
                'Your “Overall” must make a decision: VPN, remote desktop, or both.',
              );
            return complete(zi, ti, false, true);
          }
          if (t.type === 'checklist') {
            if (t.items.some((_, i) => !S.boss.checks[i]))
              return fb(
                el,
                'hint',
                'Tick every box. If one isn’t true yet, scroll up and fix your answer first.',
              );
            return complete(zi, ti, false, true);
          }
          if (ok) return complete(zi, ti, false);
          st.att[k]++;
          if (!S.firstWrong.includes(z.id + '#' + (ti + 1)))
            S.firstWrong.push(z.id + '#' + (ti + 1));
          save();
          const n = st.att[k];
          fb(
            el,
            'no',
            msg +
              (n === 1
                ? `Not quite. Hint: ${esc(t.hint)}`
                : `Still not there. ${esc(t.hint2 || t.hint)} If you’re stuck, put your hand up.`),
          );
        }
        function complete(zi, ti, tutor, written) {
          const z = Z[zi],
            st = zs(z.id),
            att = st.att['a' + ti] || 0;
          const pts = tutor
            ? 0
            : z.boss
              ? 150
              : written
                ? 100
                : Math.max(25, 100 - 25 * att);
          S.xp += pts;
          st.earned += pts;
          st.idx = ti + 1;
          if (st.idx >= z.tasks.length) {
            st.done = true;
            S.xp += z.boss ? 500 : 100;
          }
          save();
          toast(
            tutor
              ? 'Unlocked by tutor'
              : `+${pts} XP${st.done ? ` · Ticket closed! <b>+${z.boss ? 500 : 100} bonus</b>` : ''}`,
          );
          if (st.done && z.boss) {
            location.hash = 'certificate';
            route();
            return;
          }
          renderZone(zi);
        }

        function bossText() {
          const b = S.boss;
          let s = `Discuss which remote working system Seren Recruitment should use: a VPN or remote desktop. (6 marks)\n\n`;
          b.factors.forEach((f) => {
            const v = b.pre[f] || {};
            s += `${f}: ${[v.p, v.r, v.e]
              .filter(Boolean)
              .map((x) => x.trim().replace(/\.?$/, '.'))
              .join(' ')}\n\n`;
          });
          const c = b.concl;
          s += `Overall, ${(c.o || '').trim()} because ${(c.b || '').trim()} However, ${(c.h || '').trim()}`;
          return s;
        }
        function copyText(txt) {
          const done = () =>
            toast('Copied. Paste it into your C1 Google Site page.');
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(txt).then(done, () => fallback());
          } else fallback();
          function fallback() {
            const ta = document.createElement('textarea');
            ta.value = txt;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand('copy');
              done();
            } catch (e) {
              alert('Select the text and copy it with Ctrl+C.');
            }
            ta.remove();
          }
        }

        /* GUIDE */
        let gTab = 'notes';
        function renderGuide() {
          header();
          const open = Z.filter((z, i) => S.z[z.id] && S.z[z.id].started);
          let h = `<h1 style="font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-.02em;margin:0">Field guide</h1>
    <p style="color:var(--ink2);margin:4px 0 0">Everything you’ve unlocked, for revision. Come back to it any time before the January exam.</p>
    <div class="gtabs noprint"><button data-t="notes" class="${gTab === 'notes' ? 'on' : ''}">My field notes</button><button data-t="terms" class="${gTab === 'terms' ? 'on' : ''}">Key terms</button>${open.map((z) => `<button data-t="${z.id}" class="${gTab === z.id ? 'on' : ''}">${esc(z.title)}</button>`).join('')}</div>`;
          if (gTab === 'notes') {
            const all = exportText();
            h += `<div class="card"><h3>My field notes and boss answer</h3><p>Copy these into your C1 Google Site page.</p><div class="compiled">${escU(all)}</div>
      <div class="rowflex noprint" style="margin-top:12px"><button class="btn" id="cpAll">Copy everything</button><button class="btn ghost" id="pr">Print</button></div>
      ${
        S.firstWrong.length
          ? `<h3 style="margin-top:22px">Revise these</h3><p>Questions you got wrong first time: ${S.firstWrong
              .map((x) => {
                const [zid, n] = x.split('#');
                const zz = Z.find((q) => q.id === zid);
                return esc(zz.title + ' task ' + n);
              })
              .join(', ')}.</p>`
          : ''
      }</div>
      <p class="noprint" style="margin-top:28px"><button class="tutor" id="reset" style="margin:0">Reset all progress on this computer</button></p>`;
          } else if (gTab === 'terms') {
            h += `<div class="gloss">${CQ.glossary.map((g) => `<div>${esc(g[0])}</div><div>${esc(g[1])}</div>`).join('')}</div>`;
          } else {
            const z = Z.find((q) => q.id === gTab);
            h += `<article class="card brief" style="position:static;max-height:none"><span class="tag">${esc(z.handbook)}</span><h2 style="margin-top:10px">${esc(z.title)}: ${esc(z.topic)}</h2>${z.brief}</article>`;
          }
          $('#app').innerHTML = sq(h).replace(
            /IMG_(D\d)/g,
            (m, k) => `<img alt="${IMGALT[k]}" src="${IMGS[k]}">`,
          );
          document.querySelectorAll('.gtabs button').forEach(
            (b) =>
              (b.onclick = () => {
                gTab = b.dataset.t;
                renderGuide();
              }),
          );
          const c = $('#cpAll');
          if (c) c.onclick = () => copyText(exportText());
          const p = $('#pr');
          if (p) p.onclick = () => window.print();
          const r = $('#reset');
          if (r)
            r.onclick = () => {
              if (
                confirm(
                  'Delete all your Cloud Quest progress on this computer? This cannot be undone.',
                )
              ) {
                S = blank();
                save();
                location.hash = '';
                route();
              }
            };
        }
        function exportText() {
          let s = `Cloud Quest field notes: ${S.name}\n\n`;
          let any = false;
          Z.forEach((z) =>
            z.tasks.forEach((t, ti) => {
              if (
                t.type === 'write' &&
                S.notes[z.id + '_' + ti] &&
                (S.z[z.id] || {}).idx > ti
              ) {
                any = true;
                s += `${t.log}\n${S.notes[z.id + '_' + ti].trim()}\n\n`;
              }
            }),
          );
          if (zoneDone('z6')) {
            any = true;
            s += `Boss level: Seren Recruitment\n${bossText()}\n`;
          }
          return any
            ? s
            : 'Your field notes will appear here as you complete each job.';
        }

        /* CERT */
        function renderCert() {
          header();
          const d = new Date().toLocaleDateString('en-GB', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
          });
          $('#app').innerHTML =
            sq(`<div class="cert"><p style="font-family:var(--mono);color:var(--muted);margin:0">NIMBUS IT · CLOUD QUEST COMPLETE</p><h1>All six tickets closed</h1>
    <p>This certifies that</p><div class="name">${escU(S.name)}</div><p>completed Cloud Quest for BTEC Unit 1, C1 Online Systems, with</p>
    <p style="font-family:var(--head);font-size:40px;font-weight:800;margin:0">${S.xp} XP</p><p>Rank: <b>${rank(S.xp)}</b> · ${d}</p>
    <div class="badges">${Z.map((z) => `<span class="badge">✓ ${esc(z.title)}</span>`).join('')}</div>
    <p style="color:var(--ink2)">Screenshot this for your C1 Google Site page, then copy your field notes and boss answer from the field guide.</p>
    <div class="rowflex noprint" style="justify-content:center"><a class="btn" href="#guide" style="text-decoration:none">Open field guide</a><a class="btn ghost" href="#board" style="text-decoration:none">Job board</a></div></div>`);
        }

        load();
        route();
      })();
    </script>
  </body>
</html>
